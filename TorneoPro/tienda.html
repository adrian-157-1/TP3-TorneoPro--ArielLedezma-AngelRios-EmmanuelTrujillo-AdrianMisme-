<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneo Pro - Tienda</title>
  <link rel="stylesheet" href="styles/tienda.css">
</head>
<body>
 
  <!-- NAV (40px, siempre arriba) -->
  <nav class="nav">
    <a class="nav__brand" href="#">
      <img class="nav__logo" src="" alt="Logo Torneo Pro"> <!-- 👉 TU ENLACE: logo -->
      <span>Torneo Pro</span>
    </a>
    <div class="nav__links">
      <a href="#">Home</a>
      <a href="#">Tienda</a>
      <a href="#">Torneos</a>
      <img class="nav__user" src="" alt="Usuario"> <!-- 👉 TU ENLACE: icono usuario -->
    </div>
  </nav>
 
  <!-- BARRA TIENDA + CARRITO -->
  <div class="subbar">
    <span>Tienda</span>
    <button class="subbar__cart" aria-label="Carrito">
      <img src="" alt="Carrito"> <!-- 👉 TU ENLACE: icono carrito -->
    </button>
  </div>
 
  <main class="main">
 
    <!-- CARRUSEL (600px de alto, 4 imágenes) -->
    <section class="carousel" id="carousel">
      <div class="carousel__track" id="carouselTrack">
 
        <article class="slide">
          <img class="slide__img" src="" alt="Slide 1"> <!-- 👉 TU ENLACE: imagen 1 -->
          <div class="slide__info">
            <h2>Título 1</h2>
            <p>Descripción del primer slide.</p>
            <a href="#" class="slide__btn">Ver más</a>
          </div>
        </article>
 
        <article class="slide">
          <img class="slide__img" src="" alt="Slide 2"> <!-- 👉 TU ENLACE: imagen 2 -->
          <div class="slide__info">
            <h2>Título 2</h2>
            <p>Descripción del segundo slide.</p>
            <a href="#" class="slide__btn">Ver más</a>
          </div>
        </article>
 
        <article class="slide">
          <img class="slide__img" src="" alt="Slide 3"> <!-- 👉 TU ENLACE: imagen 3 -->
          <div class="slide__info">
            <h2>Título 3</h2>
            <p>Descripción del tercer slide.</p>
            <a href="#" class="slide__btn">Ver más</a>
          </div>
        </article>
 
        <article class="slide">
          <img class="slide__img" src="" alt="Slide 4"> <!-- 👉 TU ENLACE: imagen 4 -->
          <div class="slide__info">
            <h2>Título 4</h2>
            <p>Descripción del cuarto slide.</p>
            <a href="#" class="slide__btn">Ver más</a>
          </div>
        </article>
 
      </div>
      <button class="carousel__btn carousel__btn--prev" id="prev" aria-label="Anterior">&#10094;</button>
      <button class="carousel__btn carousel__btn--next" id="next" aria-label="Siguiente">&#10095;</button>
      <div class="carousel__dots" id="dots"></div>
    </section>
 
    <!-- CATEGORÍAS -->
    <section class="categories" id="categories"></section>
 
    <!-- SECCIONES DE PRODUCTOS (las genera app.js) -->
    <div id="productSections"></div>
 
  </main>
 
  <!-- FOOTER (40px, siempre abajo) -->
  <footer class="footer">
    <div class="footer__pay" id="payMethods"></div>
    <div class="footer__social" id="socials"></div>
  </footer>
 
  <script src="js/tienda.js"></script>
</body>
</html>
